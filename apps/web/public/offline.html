<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101626" />
    <meta name="robots" content="noindex" />

    <title>Reconnect · QuestRealm</title>

    <style>
      :root {
        color-scheme: light;

        --background: #f5efdf;
        --surface: #fffaf0;
        --text: #303b32;
        --muted: #70766b;
        --border: #dcd4bf;
        --primary: #496b52;
        --on-primary: #ffffff;
        --accent-soft: #f5e8bd;
        --accent: #93681d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;

          --background: #101626;
          --surface: #192235;
          --text: #f4eedc;
          --muted: #adb7ca;
          --border: #344158;
          --primary: #e7bc62;
          --on-primary: #191d29;
          --accent-soft: #373225;
          --accent: #f0c977;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        background: var(--background);
        color: var(--text);
        font-family: "Trebuchet MS", Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 460px;
        padding: 36px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface);
        text-align: center;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 18px;
        background: var(--accent-soft);
        color: var(--accent);
        font-family: Georgia, serif;
        font-size: 36px;
        font-weight: 700;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0;
        font-family: "Palatino Linotype", Georgia, serif;
        font-size: 32px;
        line-height: 1.2;
      }

      .description {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 12px 24px;
        border: 1px solid var(--primary);
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 4px;
      }

      .note {
        margin: 26px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      @media (max-width: 480px) {
        main {
          padding: 28px 22px;
        }

        h1 {
          font-size: 28px;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>

      <p class="eyebrow">QuestRealm</p>
      <h1>A moment to reconnect.</h1>

      <p class="description">
        QuestRealm couldn’t reach the network. Reconnect to load your account,
        quests, and focus timer.
      </p>

      <a href="/#dashboard">Try again</a>

      <p class="note">
        Saving changes and earning quest rewards require a connection.
      </p>
    </main>
  </body>
</html>
